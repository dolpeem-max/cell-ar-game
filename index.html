<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Plant Cell Explorer</title>
    
    <!-- เรียกใช้งานไลบรารี model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #2b2b2b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* ปุ่ม AR ด้านล่าง */
        #ar-button {
            background-color: #ffffff;
            color: #333;
            border-radius: 20px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        /* การตกแต่งปุ่มตัวเลข (Hotspot) ให้เหมือนภาพที่ 2 */
        .hotspot-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
        }

        .hotspot-number {
            background-color: rgba(40, 40, 50, 0.9);
            color: white;
            border: 1px solid #aaa;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        /* กล่องคำอธิบายสีเข้ม (Annotation Box) */
        .annotation-box {
            background-color: rgba(20, 20, 25, 0.85); /* สีดำโปร่งแสง */
            color: white;
            padding: 15px;
            border-radius: 8px;
            width: 220px;
            text-align: left;
            position: absolute;
            top: 50%;
            left: 40px; /* ให้กล่องเยื้องไปทางขวาของตัวเลข */
            transform: translateY(-50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        /* เมื่อคลิกหรือเอาเมาส์ชี้ที่ตัวเลข ให้โชว์กล่องข้อความ */
        .hotspot-btn:focus .annotation-box,
        .hotspot-btn:hover .annotation-box {
            opacity: 1;
            visibility: visible;
        }

        /* การจัดรูปแบบข้อความ 3 บรรทัด */
        .anno-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .anno-function {
            font-size: 13px;
            font-weight: bold;
            color: #4da6ff; /* เน้นสีให้หน้าที่หลักดูเด่นขึ้น */
            margin-bottom: 5px;
        }
        .anno-desc {
            font-size: 12px;
            line-height: 1.4;
            color: #dcdcdc;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="cell.glb" 
        alt="3D Plant Cell Model"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
        
        <!-- จุดที่ 1: แวคิวโอล (อ้างอิงจากหมายเลข 1 ในภาพ) -->
        <button slot="hotspot-vacuole" class="hotspot-btn" data-position="-0.2 0.1 0.4" data-normal="0 0 1">
            <div class="hotspot-number">1</div>
            <div class="annotation-box">
                <div class="anno-name">แวคิวโอล (Vacuole)</div>
                <div class="anno-function">หน้าที่: กักเก็บน้ำและรักษาสมดุล</div>
                <div class="anno-desc">เป็นออร์แกเนลล์ที่มีเยื่อหุ้ม ภายในบรรจุน้ำ สารอาหาร และของเสีย ช่วยรักษาความเต่ง (Hydrostatic pressure) ภายในเซลล์พืช</div>
            </div>
        </button>

        <!-- จุดที่ 2: นิวเคลียส (อ้างอิงจากหมายเลข 2 ในภาพ) -->
        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="0.3 0.15 -0.1" data-normal="0 1 0">
            <div class="hotspot-number">2</div>
            <div class="annotation-box">
                <div class="anno-name">นิวเคลียส (Nucleus)</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมเซลล์</div>
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ที่บรรจุสารพันธุกรรม (DNA) ทำหน้าที่ควบคุมการทำงาน การสร้างโปรตีน และการแบ่งเซลล์</div>
            </div>
        </button>

        <!-- จุดที่ 3: ไมโทคอนเดรีย (ดึงตัวอย่างเพิ่มเติมให้ครับ) -->
        <button slot="hotspot-mito" class="hotspot-btn" data-position="0.5 0.3 0.2" data-normal="1 0 0">
            <div class="hotspot-number">14</div>
            <div class="annotation-box">
                <div class="anno-name">ไมโทคอนเดรีย (Mitochondria)</div>
                <div class="anno-function">หน้าที่: แหล่งสร้างพลังงาน</div>
                <div class="anno-desc">ออร์แกเนลล์รูปร่างคล้ายเม็ดถั่ว ทำหน้าที่เผาผลาญสารอาหารเพื่อให้เกิดพลังงาน (ATP) สำหรับใช้ในกิจกรรมต่างๆ ของเซลล์</div>
            </div>
        </button>

        <!-- ปุ่มสำหรับเข้าโหมด AR -->
        <button slot="ar-button" id="ar-button">
            👁️ ดูเซลล์ในรูปแบบ AR
        </button>
        
    </model-viewer>

</body>
</html>

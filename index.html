<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Plant Cell</title>
    
    <!-- เรียกใช้งานไลบรารี model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #1e1e24; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* ปุ่มสำหรับผู้พัฒนา (คลิกเพื่อหาพิกัด) */
        #dev-helper {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #00ffcc;
            padding: 10px; border-radius: 8px; font-size: 12px; z-index: 100; font-family: monospace;
        }

        /* ปุ่ม AR ด้านล่าง */
        #ar-button {
            background-color: #ffffff; color: #333; border-radius: 20px; border: none;
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; z-index: 10;
        }

        /* การตกแต่งปุ่มตัวเลข (Hotspot) */
        .hotspot-btn { background: transparent; border: none; cursor: pointer; position: relative; }

        .hotspot-number {
            background-color: rgba(30, 30, 40, 0.95); color: white; border: 2px solid #aaa;
            border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center;
            align-items: center; font-size: 13px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
        }

        .hotspot-btn:hover .hotspot-number { border-color: #4da6ff; transform: scale(1.1); }

        /* กล่องคำอธิบายสีเข้ม (Annotation Box) */
        .annotation-box {
            background-color: rgba(15, 15, 20, 0.9); color: white; padding: 15px; border-radius: 8px;
            width: 260px; text-align: left; position: absolute; top: 50%; left: 45px; 
            transform: translateY(-50%); opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.7);
            pointer-events: none; z-index: 5; border-left: 4px solid #4da6ff;
        }

        .hotspot-btn:focus .annotation-box, .hotspot-btn:hover .annotation-box { opacity: 1; visibility: visible; }

        /* การจัดรูปแบบข้อความ 3 บรรทัด */
        .anno-name { font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #ffffff; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .anno-function { font-size: 13px; font-weight: bold; color: #4da6ff; margin-bottom: 6px; }
        .anno-desc { font-size: 12px; line-height: 1.5; color: #cccccc; }
    </style>
</head>
<body>

    <!-- กล่องแสดงพิกัดสำหรับ Developer -->
    <div id="dev-helper">คลิกบนโมเดลเพื่อหาพิกัด X Y Z<br><span id="coords">ยังไม่ได้คลิก</span></div>

    <model-viewer id="cell-model" src="cell.glb" alt="3D Plant Cell Model" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1">
        <!-- 1. แวคิวโอลขนาดใหญ่ (กระจายพิกัดออกไปให้กว้างขึ้น) -->
        <button slot="hotspot-vacuole" class="hotspot-btn" data-position="-50 20 10" data-normal="0 0 1">
            <div class="hotspot-number">1</div>
            <div class="annotation-box">
                <div class="anno-name">แวคิวโอลขนาดใหญ่ (Central Vacuole)</div>
                <div class="anno-function">หน้าที่: กักเก็บน้ำ สารอาหาร และของเสีย</div>
                <div class="anno-desc">ถุงน้ำขนาดใหญ่สีฟ้า ที่กินพื้นที่เกือบครึ่งหนึ่งของเซลล์พืช ทำหน้าที่รักษาแรงดันเต่งให้น้ำในเซลล์สมดุล หากพืชขาดน้ำส่วนนี้จะหดตัวลงทำให้ใบไม้เหี่ยวเฉา</div>
            </div>
        </button>

        <!-- 2. นิวเคลียส -->
        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="40 10 20" data-normal="0 1 0">
            <div class="hotspot-number">2</div>
            <div class="annotation-box">
                <div class="anno-name">นิวเคลียส (Nucleus)</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม</div>
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ เป็นที่กักเก็บ DNA ทำหน้าที่เหมือนห้องผู้บริหารที่สั่งการทุกกิจกรรมของเซลล์ ตั้งแต่การสังเคราะห์โปรตีนไปจนถึงกระบวนการแบ่งเซลล์</div>
            </div>
        </button>

        <!-- 3. คลอโรพลาสต์ -->
        <button slot="hotspot-chloroplast" class="hotspot-btn" data-position="-60 40 -30" data-normal="-1 0 0">
            <div class="hotspot-number">3</div>
            <div class="annotation-box">
                <div class="anno-name">คลอโรพลาสต์ (Chloroplast)</div>
                <div class="anno-function">หน้าที่: สร้างอาหารผ่านกระบวนการสังเคราะห์ด้วยแสง</div>
                <div class="anno-desc">ออร์แกเนลล์สีเขียว ที่มีรงควัตถุคลอโรฟิลล์อยู่ด้านใน ทำหน้าที่ดูดกลืนพลังงานแสงอาทิตย์มาเปลี่ยนคาร์บอนไดออกไซด์และน้ำให้เป็นน้ำตาลเพื่อเป็นอาหาร</div>
            </div>
        </button>

        <!-- 4. กอลจิบอดี -->
        <button slot="hotspot-golgi" class="hotspot-btn" data-position="10 60 -40" data-normal="0 1 0">
            <div class="hotspot-number">5</div>
            <div class="annotation-box">
                <div class="anno-name">กอลจิบอดี (Golgi Apparatus)</div>
                <div class="anno-function">หน้าที่: เติมแต่ง บรรจุ และคัดแยกโปรตีนเพื่อส่งออก</div>
                <div class="anno-desc">กลุ่มถุงแบนสีน้ำเงินซ้อนกัน ทำหน้าที่รับโปรตีนมาปรับแต่งรูปร่าง ห่อหุ้มใส่เวสิเคิล และจัดส่งไปยังจุดหมายปลายทาง คล้ายกับแผนกแพ็กและกระจายสินค้าของเซลล์</div>
            </div>
        </button>

        <!-- 5. ไมโทคอนเดรีย -->
        <button slot="hotspot-mitochondria" class="hotspot-btn" data-position="-30 -30 50" data-normal="1 0 0">
            <div class="hotspot-number">14</div>
            <div class="annotation-box">
                <div class="anno-name">ไมโทคอนเดรีย (Mitochondria)</div>
                <div class="anno-function">หน้าที่: สร้างพลังงานให้แก่เซลล์</div>
                <div class="anno-desc">โครงสร้างรูปไข่สีส้ม ทำหน้าที่เผาผลาญสารอาหารร่วมกับแก๊สออกซิเจนให้กลายเป็นพลังงาน (ATP) เปรียบเสมือนโรงไฟฟ้าที่จ่ายไฟให้เซลล์ทำกิจกรรมต่างๆ ได้</div>
            </div>
        </button>

        <!-- 6. ผนังเซลล์ -->
        <button slot="hotspot-cellwall" class="hotspot-btn" data-position="90 0 0" data-normal="-1 0 0">
            <div class="hotspot-number">12</div>
            <div class="annotation-box">
                <div class="anno-name">ผนังเซลล์ (Cell Wall)</div>
                <div class="anno-function">หน้าที่: ค้ำจุนโครงสร้างและรักษารูปทรง</div>
                <div class="anno-desc">โครงสร้างชั้นนอกสุดสีเขียว สร้างจากเซลลูโลส ทำหน้าที่เหมือนกำแพงป้องกันไม่ให้เซลล์แตกเมื่อมีน้ำออสโมซิสเข้ามา และทำให้เซลล์พืชมีรูปทรงเหลี่ยมคงที่</div>
            </div>
        </button>

        <!-- 7. ไซโทพลาซึม -->
        <button slot="hotspot-cytoplasm" class="hotspot-btn" data-position="0 -40 10" data-normal="0 1 0">
            <div class="hotspot-number">13</div>
            <div class="annotation-box">
                <div class="anno-name">ไซโทพลาซึม (Cytoplasm)</div>
                <div class="anno-function">หน้าที่: พื้นที่เกิดปฏิกิริยาเคมีและที่อยู่ของออร์แกเนลล์</div>
                <div class="anno-desc">ของเหลวคล้ายเจล ที่กระจายอยู่เต็มเซลล์ ประกอบด้วยน้ำและสารละลาย เป็นเสมือนพื้นที่ว่างให้โครงสร้างอื่นๆ ลอยอยู่และดำเนินกระบวนการเคมีที่สำคัญต่อชีวิต</div>
            </div>
        </button>

        <!-- 8. ร่างแหเอนโดพลาซึม -->
        <button slot="hotspot-er" class="hotspot-btn" data-position="40 -20 -10" data-normal="1 0 0">
            <div class="hotspot-number">15</div>
            <div class="annotation-box">
                <div class="anno-name">ร่างแหเอนโดพลาซึม (ER)</div>
                <div class="anno-function">หน้าที่: สร้างและลำเลียงโปรตีนและลิพิด</div>
                <div class="anno-desc">โครงสร้างท่อพับซ้อนกันอยู่รอบนิวเคลียส มีทั้งแบบขรุขระที่มีไรโบโซมเกาะเพื่อสร้างโปรตีน และแบบเรียบที่ช่วยสร้างไขมันและขจัดสารพิษ</div>
            </div>
        </button>

        <!-- 9. เยื่อหุ้มเซลล์ -->
        <button slot="hotspot-membrane" class="hotspot-btn" data-position="80 0 -20" data-normal="-1 0 0">
            <div class="hotspot-number">20</div>
            <div class="annotation-box">
                <div class="anno-name">เยื่อหุ้มเซลล์ (Cell Membrane)</div>
                <div class="anno-function">หน้าที่: ควบคุมการผ่านเข้าออกของสาร</div>
                <div class="anno-desc">เยื่อบางๆ ที่อยู่ติดกับผนังเซลล์ด้านใน ทำหน้าที่เป็นเยื่อเลือกผ่าน คอยคัดกรองสารอาหารและของเสียเข้าออก เพื่อรักษาสมดุลสภาพแวดล้อมภายในเซลล์ไม่ให้เปลี่ยนแปลงฉับพลัน</div>
            </div>
        </button>

        <!-- 10. ไรโบโซม -->
        <button slot="hotspot-ribosome" class="hotspot-btn" data-position="30 -30 -30" data-normal="0 -1 0">
            <div class="hotspot-number">21</div>
            <div class="annotation-box">
                <div class="anno-name">ไรโบโซม (Ribosome)</div>
                <div class="anno-function">หน้าที่: สังเคราะห์โปรตีน</div>
                <div class="anno-desc">เม็ดขนาดเล็กจิ๋วที่ลอยอยู่ในไซโทพลาซึมและเกาะบนร่างแหเอนโดพลาซึม ทำหน้าที่อ่านรหัสพันธุกรรมแล้วนำกรดอะมิโนมาประกอบเข้าด้วยกันเพื่อสร้างโปรตีนสำหรับใช้งานในเซลล์</div>
            </div>
        </button>

        <!-- ปุ่มสำหรับเข้าโหมด AR -->
        <button slot="ar-button" id="ar-button">
            👁️ ส่องเซลล์ทะลุจอ (AR Mode)
        </button>
        
    </model-viewer>

    <!-- สคริปต์เครื่องมือหาพิกัด (Dev Tool Script) -->
    <script>
        const modelViewer = document.querySelector('#cell-model');
        const coordsDisplay = document.querySelector('#coords');

        modelViewer.addEventListener('click', (event) => {
            // เมื่อคลิกบนโมเดล 3 มิติ จะดึงค่าพิกัดจุดที่คลิกออกมา
            const hit = modelViewer.positionAndNormalFromPoint(event.clientX, event.clientY);
            if (hit) {
                // ดึงค่า X, Y, Z และทำปัดเศษทศนิยม 2 ตำแหน่ง
                const x = hit.position.x.toFixed(2);
                const y = hit.position.y.toFixed(2);
                const z = hit.position.z.toFixed(2);
                
                // แสดงผลบนหน้าจอให้ก๊อปปี้ไปใช้งานได้ทันที
                coordsDisplay.innerHTML = `data-position="${x} ${y} ${z}"`;
                console.log(`คลิกได้พิกัด: data-position="${x} ${y} ${z}"`);
            }
        });
    </script>
</body>
</html>
